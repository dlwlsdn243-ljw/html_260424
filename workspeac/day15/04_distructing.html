<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        해체(Distructing), 펼침(Spread)
        : 자바스크립트에서 데이터를 좀 더 유연하게 사용하기 위한 문법 : ES2018
    </h1>
    <script>
        // distructing
        let arr = ['a','b','c','d','e'];
        let first1 = arr[0];
        let second1 = arr[1];

        // 옵셔널 파라미터도 가능.
        let [first, second, third, foruth, fifth='a'] = arr;
        console.log(first, second, third, foruth, fifth);

        // rest parameter 가능
        let [kim, lee, park,...others] = arr;
        console.log(kim, lee, park, others);

        // data exchange (데이터 값 상호교환)
        let html = 89;
        let java = 100;
        console.log(html, java);
        // java에서의 교환
        //let tmp = html;
        //html = java;
        //java = tmp;

        //destructing
        [html, java] = [java, html];
        console.log(html, java);

        const labtop = {
            title:'Apple MacBook M1 Pro',
            won: 2000000,
            cpu: 'M1',
            ram:'8GB',
            ssd:'256GB',
            display: 'retina',
            touchBar: true,
            core:'8core'
        }
        console.log(labtop.cpu, labtop.ram);

        let {title, won} = labtop;
        console.log(title, won);

        //optional parameter 처럼 사용가능
        let {display, thunderbolt='2ea'} = labtop;
        console.log(display, thunderbolt) // undefined


        // won 키 값을 price라는 이름으로 가져오기
        let propName = 'won';
        let {[propName] : price} = labtop;
        console.log(price);

    </script>
</body>
</html>
