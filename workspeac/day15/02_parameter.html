<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        javascript의 파라미터 (매개변수와 같은 의미)
    </h1>
    <!-- 
        - 함수에서 파라미터의 개수는 상관 없음.
        - 파라미터의 개수와 상관없이 함수(메서드)명이 같다면 호출가능
        - 파라미터 개수가 불일치하여 값을 받지 못하는 변수가 있다면 undefined처리
        - 값을 받아오지 못하는 파라미터가 undefined처리 되는것을 막기위해 기본값을 설정할 수 있음
            => optional parameter
        - 파라미터는 argments라는 프로퍼티로 파라미터들을 관리
        - argments 배열로 담겨서 관리됨
        - optional parameter argments에 저장되지 않음
        - optional parameter 다른 파라미터보다 뒤에 있어야 한다. (가장 끝에 존재)

        - rest parameter : 남는 (이외의, 남는것들) 파라미터
        - 사용할 파라미터는 일반 파라미터에 저장하고 나머지 파라미터들을 통합하여 배열로 관리하는 방법
        - ... : spread연사낮라고 하고, 배열, 객체를 복사할 때도 사용
    -->

    <script>
        // optional parameter
        function testFunc(p1,p2,p3,p4=0,p5=0){
            console.log(p1,p2,p3,p4,p5)
            console.log(arguments)
        }

        testFunc(1,2,3);
        testFunc(1,2,3,4,5);
        testFunc(1,2,3,4,5,6);

        function testFunc2(){
            console.log('parameter X')
        }
        // 함수에서 파라미터를 받지 않아도 에러가 나지 않음
        // 파라미터는 버려짐
        testFunc2(1)

        // rest parameter
        function restFunc(a,b,...others){
            let sum = 0;
            console.log(a,b);
            console.log(others);
            sum = a+b;
            for(let arg of others){
                sum += arg;
            }
            console.log(sum)
        }
        restFunc(1,2,3,4,5,6);
        restFunc(1,2)

        console.log('---------------------------------')

        // ...spread연산자
        const oldArr = ['a','b','c','e','t','u','p']
        let newArr = [...oldArr]
        console.log(oldArr, newArr)

        let newObj = {...oldArr};
        console.log(newObj)

        function sum(x,y,z){
            return x+y+z;
        }
        let num = [4,2,5,7,8,4,5,1,2,4,4,5]

        let a = sum(...num)
        console.log(a)

        restFunc(...num)
    </script>
</body>
</html>
