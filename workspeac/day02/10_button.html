<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <!-- 
            button 태그 : input type="submit"과 같은 기능을 하는 태그
            buttom type="buttom" / submit / reset
            form 태그와 같이 사용
            form 태그안에서 버튼 태그의 가본값이 submit
            input 보다 button 태그를 더 많이 사용
        -->
        <button>일반버튼</button>
        <button type="submit">submit form 없으면 아무것도 안됨</button>
        <button type="reset">reset form 없으면 아무것도 안됨</button>

        <form action="">
            <input type="text" name="id" id="">
            <!-- form 안의 버튼의 가본값은 submit -->
            <button>submit</button>
        </form>
    </body>
</html>
