<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /*주석 여기는 css 영역 html과 다른 영역
        
        선택자 {
            속성: 값;
            속성: 값;
            속성: 값;
            ...
        }
            - 선택자 : 스타일을 적용할 태그를 선택하는 부분
            - 속성 : 스타일의 종류 (글자색, 배경색, 테두리 등등)
            - 값 : 스타일의 구체적인 형태 (빨간색, 20px, solid 등등)
            - 세미콜론(;) : 속성과 값을 구분하는 역할
            - 중괄호({}) : 선택자와 속성값을 묶어주는 역할

        선택자 tagName, class, id => 같은 선택자는 같은 스타일을 적용받음
    
            css 적용 방법
            1. <style> 태그를 이용하여 스타일을 적용
                <head> 태그 내부에 선언
            2. 각 태그마다 직접 style 속성을 적용하는 방법
            3. css 파일을 만들어 link를 이용하여 파일을 연결하는 방법 => 가장 많이 사용
                하나의 파일로 여러 html에 동일하게 적용
        */
        img{
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <!-- 
        css : 스타일을 꾸며주는 기능
        - html태그의 스타일을 꾸며주는 기능
        - css 적용하는 방법
        1. <style> 태그를 이용하여 스타일을 적용
            <head> 태그 내부에 선언
        2. 각 태그마다 직접 style 속성을 적용하는 방법
        3. css 파일을 만들어 link를 이용하여 파일을 연결하는 방법 => 가장 많이 사용
            하나의 파일로 여러 html에 동일하게 적용

        3번은 일반 실무에서 가장 많이 사용하는 방법
        수업에서는 1번 형식으로 사용
        2번은 거의 안씀. => 특별한 케이스에서만 사용
    -->
    <img src="../image/강아지.jpg" alt="강아지">
    <img src="../image/강아지2.jpg" alt="강아지2">
</body>
</html>
