<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- div : 상자를 만들어 주는 태그
         영역을 구분하는 역할 => 공간을 만들어주는 => layout구조를 짜는 역할
         - 컨테이너 역할을 하는 태그
         - 사용량으로 놓고보면 가장 많이 사용하는 태그

         - 시멘틱 웹(태그) : div태그에 의미를 부여한 개념
         - <div> </div>    => <header> </header>
         - <div> </div>    => <nav> </nav>
         - <div> </div>    => <main> </main>
         - <div> </div>    => <footer> </footer>
         가독성을 높이기 위해, 통일성을 유지하기 위해
    -->

    <!-- 
        태그 분류 방법
        - block 요소 : 줄바꿈이 일어나는 요소 (div, header, nav, main, footer, p, h1~h6)
            - 혼자 한 라인을 차지 (새로운 라인에서 시작)
            - 가로 / 세로 크기 조절이 가능
            - 여백 조절 가능
            - div, header, nav, main, footer, p, h1~h6

        - inline 요소 : 줄바꿈이 일어나지 않는 요소 (span, a, b, del, ins, i)
            - 한 라인에서 계속 유지되는 태그
            - 컨텐츠 자체가 태그의 크기가 됨
            - 가로 / 세로 크기 조절이 불가능
            - 여백 지정이 안됨
            - 폰트 크기 지정이 가능
            - span, a, b, del, ins, i

        - inline-block 요소 : 줄바꿈이 일어나지 않지만 block 요소의 특징을 가지는 요소 (input, button)
            - 한 라인에서 계속 유지되는 태그
            - 가로 / 세로 크기 조절이 가능
            - 여백 조절 가능
            - input, button, img
    -->
         <div class="">div</div>
         <div class="box">box</div>
         <header>geader tag...</header>
         <main>maim tag...</main>
</body>
</html>
