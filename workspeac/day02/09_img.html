<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <!-- 
            img 태그
            - input type="image" 와 같은 기능을 하는 태그
            - src : 이미지 경로
            - alt : 이미지가 없을 때 대체 텍스트
            - width : 이미지의 가로 길이
            - height : 이미지의 세로 길이
            - 이미지 사이즈 : pixe1 / % 로 표시가능
        -->
        <!-- 
            이미지 형식
            html에서 사용되는 이미지 포멧 중 jpg(jpeg), png 대표적

            - jpg : 손실 압축 포멧 - 사진
            - 이미지의 해상도가 송상되어도 용량을 많이 줄이는 포멧
            - 가장 많이 사용

            - png : 무손실 압축 포멧 - 캐릭터, 아이콘, 로고, 그림
            - 이미지 해상도의 손실을 줄이고 투명 배경이 가능
            - 용량은 좀 크지만 화질이 뛰어남

            이미지 파일들은 헤더영역에 image/jpg, image/png 등의 형식을 가지고 있음
            파일의 확장자명과 관계없이 헤더 정보로 그림을 파악
            이미지의 리소스가 잘못된 정보를 갖는 경우 : 엑박이 떴다 라고 표현
        -->
        <img src="../image/강아지.jpg" alt="강아지">
        <img src="../image/강아지.jpg" alt="강아지" width="300" height="300">
        <!-- 나를 감싸고 있는 태그(부모) 기준으로 % -->
        <img src="../image/강아지.jpg" alt="강아지" width="100%">
    </body>
</html>
