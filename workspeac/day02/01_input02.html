<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>title</title>
</head>
    <body>
        <!-- type = "number" : 위 아래 버튼이 생김, 숫자만 가능. min, max -->
        <input type="number" value="1" min="0" max="10">
        <!-- 
            type = "image" : 그림을 삽입하는 태그 img
            src = "그림위치" alt = "그림이 표시되지 않을 때 대체문자"
            상대경로 : 현재 내 팡일로부터 상대적인 경로 ../
            절대경로 : 드라이브부터 파일까지의 경로 D:\wed0260324\~
        -->
        <input type="image" src="../image/강아지.jpg" alt="강아지 그림">
        <br>
        <input type="image" alt="강이지 그림" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-IgHSHeIU03xgIyBLbLpLjslag-zfHeubOqAwQh8PltjEaF7waBMAfxVY77rGxk76AXCgOr-nQhn5w3F3P99S38ehGjje3cjcNdf0QN5d&s=10">
        <br>

        <!-- type = "range" : 범위값을 나타내는 상태바 -->
         0<input type="range">10
    </body>
</html>
