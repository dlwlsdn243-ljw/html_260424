<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        promise chain 방식
    </h1>
    <!-- 
        promise 객체를 리턴하여 값을 가져오면 
        then 메서드를 실행하여 실행 순서를 기다리게 할 수 있음.

        fetch(url, [config]) : 데이터 통신을 위해 제공하는 함수
        config(header에 적용되는 각종 정보를 설정)
         - method: post, put, delete
         - content-type : 보내는 객체의 데이터 타입
        
        then : promise 객체를 연결 리턴하는 함수
         - 메서드를 기다려서 리턴값이 만들어지면 다음 로직을 수행할 수 있도록 연결

         https://jsonplaceholder.typicode.com/todos/1
         /comments?postId=1
    -->
    <button id="btn">데이터 가져오기</button>
    <ul id="ul"></ul>
    
    <script>

        // todos  completed=true 데이터만 뿌리기
        document.getElementById('btn').addEventListener('click',()=>{
            fetch('https://jsonplaceholder.typicode.com/todos?userId=1')
            .then(response => response.json())
            .then(json => printData(json))  // 성공시
            .catch(error => console.log(error)); // 실패시
        });

        function printData(obj){
            const ul = document.getElementById('ul');
            let str = '';
            for(const arr of obj){
                for(const key in arr){
                    str += `<li>${key} : ${arr[key]}</li>`;
                }
                str += `<hr>`
            }
            ul.innerHTML = str;
        }

    </script>
</body>
</html>
