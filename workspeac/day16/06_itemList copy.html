<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* width 없는 상태 => 100% 글자를 가운데 정렬 text-align : center
           width 있는 상태 => magin: 0 auto*/
        body{
            text-align: center;
        }
        
        form{
            width: 600px;
            margin: 0 auto;
            background-color: aliceblue;
            padding: 30px 40px;
            box-sizing: border-box;
        }
        form>input{
            border: none;
            outline: none;
            padding: 10px;
            width: 300px;
            border-radius: 5px;
        }

        form>button{
            padding: 8px;
            border: none;
            background-color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
        }
        ul{
            margin: 0 auto;
            padding: 0;
            list-style: none;
            width: 600px;
            box-sizing: border-box;
        }

        ul>li{
            padding: 12px 20px;
            background-color: aqua;
            text-align: left;
            position: relative;
        }

        ul>li>.close{
            position: absolute;
            top: 0;
            right: 0;
            padding: 12xp 20px;
            cursor: pointer;
        }
        ul>li:nth-child(odd){
            background-color: aquamarine;
        }

    </style>
</head>
<body>
    <h1>여행 준비물 점검 목록</h1>
    <form action="">
        <input type="text" name="" id="item">
        <button type="button" id="btn">추가</button>
    </form>
    <div>
        <ul id="itemList"></ul>
    </div>

    <script>
        // CRUD 
        // C : create 생성 => item 생성 => 저장공간에 저장
        // R : read 읽기 => 저장공간에 담긴 내용을 읽기 => 출력
        // U : update 수정 => 저장공간에 담긴 내용을 읽어온 후 => 바꾸기(내용수정) => 저장공간에 다시 저장
        // D : delete : 삭재 => item 배열에서 삭제(삭제하려는 item이 무엇인지 인지)

        const itemList = [] // C

        // 삭제
        document.getElementById('itemList').addEventListener('click',(e)=>{
            console.log(e.target.classList);
            // class : 여러개 설정이 가능 => 배열로 리턴 => DOMTokenList
            // classList => e.target.classList
            // classList가 배열이기 때문에 == 로 비교할 수 없음. => contains로 비교(포함되어 있는지 확인)
            if(e.target.classList.contains('close')){
                // 삭제
                let id = e.target.id;
                // 배열에서 id 번지의 값 1개만 지우기
                // splice(번지, 개수) (삭제)
                itemList.splice(id, 1);

                console.log(itemList);

                // 삭제 후 배열의 값을 다시 출력
                printData();
            }
            
        })

        // 추가기능
        document.getElementById('btn').addEventListener('click', ()=>{
            const item = document.getElementById('item') // 객체자 배열로 저장할 경우 const으로 저장
            //let str = document.getElementById('item') // string으로 저장할 경우 let으로 저장

            if(item.value.trim() == ''){
                alert('item 값이 없습니다.');
                item.focus(); // 커서 보내기
            }else{
                itemList.push(item.value);
                item.value = ''
                item.focus(); // focus의 대상은 element자체

                console.log(itemList)

                // 추가한 내용을 화면에 출력
                printData();
                
            }
            // 리스트 뿌리기
            function printData(){
                // itemList 출력
                let str = '';
                for(let i=0; i<itemList.length; i++){
                    str+=`<li>${itemList[i]} <span id="${i} class="close">❌</span></li>`
                }
                document.getElementById('itemList').innerHTML=str
            }



        })



        


    </script>
</body>
</html>
