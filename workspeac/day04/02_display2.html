<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
            padding: 0;
        }

        ul>li{
            display: inline;
            margin-right : 10px 20px ;
            font-size: 20px;
        }

        ul>li::after{
            content: " / ";
            /* 해당 컨텐츠의 위치를 움직여 줘야 함 posstion 속성을 이용*/
            /*padding-right : 10px;*/
        }

        ul>li:last-child::after{
            content: "";
        }

    </style>
</head>
<body>
    <ul>
        <li>외투</li>
        <li>상의</li>
        <li>하의</li>
        <li>악세사리</li>
        <li>문의</li>
    </ul>
</body>
</html>
