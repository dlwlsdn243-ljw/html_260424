<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            /* width: calc(100% / 4); */
            width: 25%;
            height: 50px;
            border: 1px solid black;
            text-align: center;
            float: left;
            line-height: 50px;
            box-sizing: border-box;
            cursor: pointer;
            border-right: none;
            
        }

        .box>a{
            text-decoration: none;
            color: black;
        }

        .box:hover{
            background-color: yellow;
        }

        .end{
            border-right:1px solid black ;
        }
    </style>
</head>
<body>
    <div class="p-box">
        <div class="box">
            <a href="http://www.naver.com" target="_blank">menu1</a>
        </div>
        <div class="box">
            <a href="">menu2</a>
        </div>
        <div class="box">
            <a href="">menu3</a>
        </div>
        <div class="box end">
            <a href="">menu4</a>
        </div>
    </div>
</body>
</html>
