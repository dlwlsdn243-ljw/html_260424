<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 
        p-box (h150px) box(100*100) 3개를 나열 position 사용

        outer(300*300), inner (100*100) 정가운데 위치
    -->
    <style>
        .p-box{
            height: 150px;
            background-color: orange;
            position: relative;
        }

        .box{
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .box1{
            background-color: blue;
            position: absolute;
            top : 25px;
            left: 25px;
        }

        .box2{
            background-color: purple;
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translate(-50%); /* transform : 나의 요소가 변호하는 기능 translate:움직임*/
        }

        .box3{
            background-color: brown;
            position: absolute;
            top: 25px;
            right: 25px;
        }

        .outer{
            width: 300px;
            height: 300px;
            background-color: aquamarine;
            position: relative;

        }

        .inner{
            width: 100px;
            height: 100px;
            background-color: antiquewhite;
            /* 요소를 정 가운데 위치시키는 방법 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform:translate(-50%, -50%)
        }
    </style>
</head>
    <body>
        <div class="p-box">
            <div class="box box1"></div>
            <div class="box box2"></div>
            <div class="box box3"></div>
        </div>

        <div class="outer">
            <div class="inner"></div>
        </div>
    </body>
</html>
