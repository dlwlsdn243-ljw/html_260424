<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>자바스크립트에서 배열은 java에서의 list, array를 섞어놓은 형태</h1>
    <h3>- list 처럼 크기가 유동적임 / method를 제공</h3>
    <h3>- 표현은 벼열처럼 arr[0]</h3>
    <h3>- index를 가짐. : 0부터 시작</h3>
    <h3>- length : 배열의 총 길이</h3>
    <h3>- const array = [] : 빈 배열을 만든 후 데이터를 추가하여 사용</h3>
    <h3>- const member = [{...}, {...}, {...}] : 일반적인 구조</h3>
    <h3>- const arr = new Array(1,2,3); 가능하지만 잘 사용하지 않음</h3>

    <script>
        // javascript 에서의 배열은 타입 혼용이 가능
        const myArray = [1,2,3,'1','b','c',[1,2,3], {key:'value'}]
        console.log(myArray)
        console.log(myArray.length)
        console.log(myArray[0]) // for문 사용 가능
        console.log(myArray[myArray.length-1]) // 마지막 번지

        // 배열의 마지막 요소에 값을 추가
        myArray[myArray.length] = 10;
        console.log(myArray) 

        // 배열의 1번지를 20으로 변경
        console.log(myArray)
        myArray[1] = 20

        // 배열의 10번지를 200으로 변경 (9번지는 빈값)
        console.log(myArray)
        myArray[10] = 200

        console.log('----------------')

        for (let i=0; i<myArray.length; i++){
            console.log(myArray[i] ?? '빈값') // 만약 arr가 비어있으면 그 빈값을 '빈값으로 출력'
        }

        console.log('----------------')

        for (let a of myArray){
            console.log(a)
        }
        
        // const로 객체를 정의하면 객체 자체가 바뀌는 일은 불가능
        // 해당 객체의 요소가 바뀌는건 가능


    </script>
</body>
</html>
