    <h1>
        JSON(JavaScriip Object Notation)
    </h1>
    <!-- 
        많은 양의 데이터를 실시간으로 전달되어야 할때 가장 효율적이고 편리한 데이터 전송 방식 JSON
        - JSON : javascript 객체를 구조화괸 데이터로 표형하기 위한 문자 기반의 표준 포멧

        - 화면 <-> 서버 데이터를 전송할 때 일반적으로 사용
        XML
        <name>IU</name>
        <age>20</age>

        JDON
        {
            name : 'IU'
            age : 20
        }

        - 자바스크립트의 객체 형태를 띄우기 때문에 구조 파악이 쉽고 제작도 쉽다. XML -> JSON
        - 모든 웹 분야에서 화면은 자바 스크립트가 모든 프론트에서 호환
        - 데이터를 수집, 출력 하는 용도로 거의 모든 플랫폼에서 사용되고 있음

        - object -> string : 원하는 서버로 전송
        - string -> 각자 서버에서 처리할 수 있는 객채로 변환 (json 라이브러리)

        - 자바스큷트에서는 JSON 객체를 string 변환하고, string -> object 변경하는 명령어가 이미 있음
        JSON.stringify(object) => string 변경 (원하는 서버로 데이터 전송)
        JSON.parse(string) => object 변경
    -->
