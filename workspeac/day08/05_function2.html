<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <h1> 함수의 파라미터와 리턴타입</h1>        

        <!-- 
            파라미터의 개수는 제한이 없으나 많으면 관리가 힘듦
            파라미터의 타입도 제한이 없음 전달된 내용 그대로 사용
            파라미터의 변수명은 외부 변수명과 같아도 달라도 상관없음
            return 유무에 따라 값을 리턴받을 수도 있고 그냥 종료 될 수 도 있음
            return의 위치에 따라 종료 시점을 결정
        -->

        <script>
            let myName = '홍길동';

            function callName(name){
                let yourName = "김순이";
                console.log(`파라미터 => ${name}`)
                console.log(`함수 내부에서 선언한 변수 => ${yourName}`)
                console.log(`함수 외부에서 선언한 변수 => ${myName}`)
                console.log(`함수 외부에서 선언한 변수 => ${myName2}`)
            }
            // 함수 내부에 선언돈 yourName 인지가능? =? 당연히 불가능
            // console.log(yourName)

            //callName('영이2') // 호출기점2

            let myName2 = 'hong gil dong';

            callName('영이') // 호출시점1

            // return이 있는 함수
            // num1, num2 를 파라미터로 받아 덧셈 결과를 리턴
            function sum(num1, num2){
                return num1 + num2
            }
            let result = sum(10,20)
            console.log(result)
            console.log(sum(100,200))

            // 표현식 함수 : react, js라이브러리 등에서 많이 사용됨
            const myFunc = function(param){
                return `hello~!! ${param}`;
            }
            let result2 = myFunc('hong')
            console.log(result2)

            // 화살표 함수 (arrow function)
            const arrowFunc = (param1, param2) => {
                return param1 + param2
            }
            let arrowresult = arrowFunc(50,50)
            console.log(arrowresult)


            // 함수생성
            // 파라미터로 이름과 취미를 받아서 콘솔에 출력
            // function / 표현식 / 화살표함수

            // 기본형 함수
            let name = '홍길동'
            let hobby = '독서'
            function call(name, hibby){
                console.log(`${name}은 ${hobby}를 좋아합니다.`)
            }
            call(name, hobby)

            // 표현형 함수
            const call1 = function(name, hobby){
                console.log(`${name}은 ${hobby}를 좋아합니다.`)
            }
            call1(name, hobby)

            // 화살표 함수
            const call2 = (name, hobby) => {
                console.log(`${name}은 ${hobby}를 좋아합니다.`)
            }
            call2(name, hobby)



        </script>
    </body>
</html>
