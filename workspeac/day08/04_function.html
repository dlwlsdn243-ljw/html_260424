<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        function 함수 : 특정 기능을 수행하기 위해 작성한 코드
        java에서의 method와 동일한 의미
    </h1>
    <!-- 
        - 함수는 호출되어야 실행
        - java의 method처럼 호출해서 실행
        
        - java에서는 class -> method생성 -> 객체 생성 -> 호출
        - 자바 스크립트는 어디서든 function생성 가능 -> 호출

        function 함수명(파아미터) {
            console.log(파라미터);
            로직 작성;
            return 값 (없으면 안쓰면 됨);
        }

        - 함수명 : 기능을 함축적으로 작성
        - 파라미터(매개변수) : 없어도 ()는 있어야 함
        - 자바스크립트는 파라미터의 자유도가 높아서 다양한 형태로 사용 가능
        - return은 함수의 종료의 역할과 동시에 특정 결과값을 호출한 위치로 반환
    -->
    <script src="01_script.js"></script>
        <script>
            // 함수 선언
            function myFirstFunc(){
                console.log("첫번째 함수")
            }
            // 함수 호출
            myFirstFunc()

            mySecondFunc() // 외부 함수 호출 (외부 파일 호출을 미리 해놔야 함)

            function call(name){
                console.log(`내 이름은 ${name} 입니다.`)
            }
            call("홍길동")

            let name = '김영이'
            call(name)

            // num1, num2 두 수를 파라미터로 받아 두 수의 합을 콘솔에 출력하는 함수 생성 => 호출
            function add(num1, num2){
                console.log(num1 + num2)
                console.log()
            }
            add(1,2)

            let num1 = 3
            let num2 = 5
            add (num1, num2)

        </script>
</body>
</html>
