<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../day17/reset.css">
    <style>
        body{
            text-align: center;
        }

        .h1{
            width: 600px;
            height: 40px;
            margin: 0px auto;
            padding: 18px 0 0 0;
            font-size: 25px;
            border: 3px solid black;
            font-weight: 900;
        }
        ul{
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            width: 600px;
        }
        ul>li{
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            margin-top: 40px;
            padding: 0 50px;
        }
        
        img{
            margin-top: 10px;
            width: 600px;
            height: 400px;
        }


    </style>
</head>
<body>
    <h1 class="h1">Travel</h1>
    <ul>
        <li id="home">HOME</li>
        <li id="Seoul">Seoul</li>
        <li id="Tokyo">Tokyo</li>
        <li id="Paris">Paris</li>
    </ul>
    <p>
        <img src="../image/HOME.png" alt="" class="img1">
    </p>

    <script>
        const img = document.querySelector('.img1');
        document.getElementById('home').addEventListener('click', ()=>{
            img.src = "../image/HOME.png";
            
        })
        document.getElementById('Seoul').addEventListener('click', ()=>{
            img.src = "../image/서울사진.jpeg";
            
        })
        document.getElementById('Tokyo').addEventListener('click', ()=>{
            img.src = "../image/도쿄사진.jpeg";
            
        })
        document.getElementById('Paris').addEventListener('click', ()=>{
            img.src = "../image/파리사진.jpeg";
            
        })
    </script>
</body>
</html>
