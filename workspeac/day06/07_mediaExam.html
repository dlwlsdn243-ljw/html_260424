<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- min-width : 기본이 작은것 점차 크게 레이아웃 변경 -->
    
    <style>
        body{
            margin: 0;
        }

        .header{
            height: 60px;
            background-color: darkgray;
            font-size: 20px;
            font-weight: 700;
            padding-left: 40px;
            line-height: 60px;
            box-sizing: border-box;
        }

        .main-img{
            background-image: url(../image/main.png);
            height: 300px;
            background-size: cover;
            background-position: center;
        }

        .subject{
            height: 400px;
            background-color: azure;
        }

        .subject>h4{
            color: gray;
            font-size: 20px;
            margin: 30px;
        }

        .subject>h3{
            font-size: 20px;
            margin: 30px;
        }

        .subject>p{
            font-size: 15px;
            margin: 30px;
        }

        .content{
            height: 500px;
            background-image: url(../image/이미지1.png);
            background-size: cover;
        }

        .sub{
            height: 300px;
            background-image: url(../image/이미지2.png);
            background-size: cover;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sub>a{
            text-decoration: none;
            color: white;
 
        }

        .sub>a>button{
            width: 230px;
            height: 50px;
            font-size: 20px;
            color: rgb(18, 2, 2);
        }

        .footer{
            height: 200px;
            background-image: url(../image/이미지3.png);
            background-size: cover;
        }

        @media screen and (min-width: 800px) {
            .content{
                height: 500px;
                width: 50%;
                float: left;
            }
            
            .sub{
                height: 250px;
                width: 50%;
                float: right;
            }

            .footer{
                height: 250px;
                width: 50%;
                float: right;
            }

        }
    
        @media screen and (min-width : 1200px) {

            .main-img{
                height: 800px;
                width: 50%;
                float: left;
            }

            .subject{
                height: 400px;
                width: 50%;
                float: right;
            }
            
            .content{
                height: 400px;
                width: 25%;
                float: left;
            }


            .sub{
                height: 200px;
                width: 25%;
                float: right;
            }

            .footer{
                height: 200px;
                width: 25%;
                float: right;
            }


            
        }
    </style>
</head>
<body>
    <div class="header">IN'O</div>
    <div class="main-img"></div>
    <div class="subject">
        <h4>Portfolio</h4>
        <h3>Make Hardward Soft</h3>
        <p>The standard chunk of Lorem Ipsum used since the 1500s is reqroduced below for those interested. 
            Section 1.10.32 and 1.10.33 from "de Finibus Bonorum et Malorum" by Cicero are also</p>
    </div>
    <div class="content"></div>
    <div class="sub">
        <a href="#top">
           <button>view more</button>
        </a>
    </div>
    <div class="footer"></div>
</body>
</html>
