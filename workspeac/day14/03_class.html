<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        class : 자바 스크립트에서도 클래스 생성이 가능
    </h1>
    <!-- 
        객체의 구조를 표준화 시켜 관리를 설계하기 위한 방법으로 이용
        일반 자바스크립트의 페이지 에서는 잘 쓰지 않음
        대형 프로젝트에서 에서 많이 사용
        ja로 백엔드를 구성할 때 주로 사용
        nest, JS프레임워크 사용할때 typeScript의 대형 프로젝트 할 때 많이 사용
        예전엔 react에서도 class중심의 구조를 많이 사용했었음

        - 1. 객체 구조 관리가 편함
        - 2. 유지보수가 쉬움
        - 3. typeScript의 프로젝트에서 많이 사용
    -->

    <!-- 
        클래스 생성 기본 문법
        class 클래스명 {
            생성자

            메서드 정의

            getter / setter
        }
    -->
</body>
</html>
