<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        생성자 함수 : 클래스를 함수화
        일반 함수랑 생성자 함수는 별 차이가 없음

        - 반드시 new키워드를 통해 실행
        - 첫글자가 대문자일것
    -->

    <script>
        // 생성자 함수
        class PersonClass{
            constructor(first, last, age, addr){
                this.firstName = first
                this.lastName = last
                this.age = age
                this.address = addr
            }
            get personInfo(){
                return `${this.firstName}${this.lastName}(${this.age} / ${this.address})`
            }
        }

        const me = new PersonClass('kim', 'minji', 20, 'suwon')
        console.log('생성자 함수')
        console.log(me)
        console.log(me.personInfo)

        // 일반함수로 변환
        function PersonClassObject(first, last, age, addr){
            this.firstName = first
            this.lastName = last  
            this.age = age
            this.address = addr         
            this.getPersonInfo = function(){
                return `${this.firstName}${this.lastName}(${this.age} / ${this.address})`
            }
        }

        const my = new PersonClassObject('lee', 'minju', 20, 'seoul')
        console.log('일반함수로 변환')
        console.log(my)
        console.log(my.getPersonInfo) // 해당 맴버변수의 함수를 가져오세요 (실행)

        // 객체로 생성 : 주로 많이 사용
        const person = {
            firstName : '',
            lastName : '',
            age : '',
            address : '',
            setInfo : function(first, last, age, addr){
                this.firstName = first
                this.lastName = last  
                this.age = age
                this.address = addr 
            },
            get personInfo(){
                return `${this.firstName}${this.lastName}(${this.age} / ${this.address})`
            },
            set setFirstName(first){
                this.firstName = first;
            }
        }

        person.setInfo('hong', 'gildong', 40, 'seoul')
        console.log('객체로 생성')
        console.log(person)
        console.log(person.personInfo) // getter호출

        person.setFirstName = 'kim' // setter 동작
        
    </script>
</body>
</html>
