<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        class로 User 생성
        - 생성자로 name, birth를 받아서 맴버변수로 저장
        - get age() : 나이를 리턴 오늘 날짜 연도 - 생년월일 연도
        - status() : 성인인지 미성년자인지 콘솔 출력하는 메서드 생성 (18세)
                    홍길동 님은 (40) 성인 입니다.
                    김민지 님은 (15) 미성년자 입니다.

        2명의 객체를 생성해서 콘솔에 출력
    -->

    <script>
        class User{
            constructor(name, birth){
                this.name = name
                this.birth = birth
            }
            
            get age(){
                let birthday = new Date(this.birth).getFullYear();
                let today = new Date().getFullYear();
                return today-birthday
            }

            status(){
                if(this.age >= 18){
                    console.log(`${this.name} 님은 (${this.age}) 성인 입니다.`)
                }else(
                    console.log(`${this.name} 님은 (${this.age}) 미성년자 입니다.`)
                )
            }
        }
        const hong = new User('hong', '2000-01-01')
        const kim = new User('kim', '2017-01-01')
        console.log(hong,kim)

        hong.status()
        kim.status()
    </script>
</body>
</html>
