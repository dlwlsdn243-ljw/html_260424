<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 계좌 myAccount, yourAccount

        // 1. 객체(object)를 사용하여 생성
        const myAccount = {
            name : 'hong',
            balance : 10000,
            //입금
            deposit: function(amount){
                this.balance += amount;
            },
            //출금
            withdraw: function(amount){
                if(this.balance < amount){
                    console.log('잔액부족');
                }else{
                    this.balance -= amount;
                }
            },
            //송금
            transfer: function(amount, otherAccount){
                if(this.balance < amount){
                    console.log('잔액부족');
                }else{
                    this.balance -= amount;
                    otherAccount.balance += amount;
                }
            }
        }
        const yourAccount = {
            name : 'kim',
            balance : 50000,
            //입금
            deposit: function(amount){
                this.balance += amount;
            },
            //출금
            withdraw: function(amount){
                if(this.balance < amount){
                    console.log('잔액부족');
                }else{
                    this.balance -= amount;
                }
            },
            //송금
            transfer: function(amount, otherAccount){
                if(this.balance < amount){
                    console.log('잔액부족');
                }else{
                    this.balance -= amount;
                    otherAccount.balance += amount;
                }
            }
        }

        myAccount.deposit(50000);
        myAccount.withdraw(20000);
        myAccount.withdraw(50000); // 잔액부족
        myAccount.transfer(20000, yourAccount);
        console.log(myAccount, yourAccount);



        // 2. class로 생성
        // - name, balance
        // - deposit(입금) / withdraw(출금) / transfer(송금)
        class BankAccount{
            constructor(name, balance){
                this.name = name;
                this.balance = balance;
            }
            deposit(amount){
                this.balance += amount;
                return this.balance; // 잔액 리턴
            } 
            withdraw(amount){
                if(this.balance < amount){
                    console.log("잔액부족!!");
                }else{
                    this.balance -= amount;
                }
                return this.balance;
            }
            transfer(amount, yourAccount){
                if(this.balance < amount){
                    console.log("잔액부족!!");
                }else{
                    this.balance -= amount;
                    yourAccount.balance += amount;
                }
                return this.balance;
            }

        }

        const leeAcc = new BankAccount('lee', 10000);
        const parkAcc = new BankAccount('park', 30000);

        console.log("lee 입금: ", leeAcc.deposit(30000));
        console.log("lee 출금: ", leeAcc.withdraw(20000));
        console.log("lee 송금: ", leeAcc.transfer(20000, parkAcc));
        console.log('park 내역:', parkAcc.balance);

        console.log(leeAcc, parkAcc);

    </script>
</body>
</html>
